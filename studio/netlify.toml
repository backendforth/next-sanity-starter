# Netlify — Sanity Studio in `studio/` (pnpm monorepo). The default way to host the Studio.
#
# One repository, two Netlify sites: the web app reads the root `netlify.toml`, the
# Studio site reads this file. Create the Studio site from the same repository with:
#   Base directory:     (empty — the repo root, so pnpm can resolve workspace packages)
#   Package directory:  studio   ← Netlify then reads this file instead of the root one
#   Build command / publish directory: leave empty, they are set below
# Then add the Studio's domain under Domain management, and the same origin to the Sanity
# project's CORS origins **with credentials** (root `README.md` → "Studio on Netlify").
#
# Set in Site configuration → Environment variables. `SANITY_STUDIO_*` values are inlined
# into the Studio bundle at BUILD time, so a change needs a redeploy.
#   SANITY_STUDIO_PROJECT_ID      — required
#   SANITY_STUDIO_PREVIEW_ORIGIN  — the web app's origin, opened by Presentation
#   SANITY_STUDIO_HOSTING_URL     — this Studio's own URL (custom domain)
#   SANITY_AUTH_TOKEN             — optional: registers the URL and uploads the schema
# Full list: `studio/.env.example`.
#
# The alternative, Sanity's own hosting (`*.sanity.studio`), stays one command away:
# `pnpm studio:deploy`. It does not read this file.

[build]
  # Paths are relative to the base directory (the repo root), not to `studio/`.
  # `register` registers the hosting URL with Sanity and uploads the schema — only on a
  # production deploy with `SANITY_AUTH_TOKEN` set; everywhere else it logs and skips.
  # Netlify installs the workspace itself before this runs.
  command = "pnpm --filter studio run build && pnpm --filter studio run register"
  publish = "studio/dist"
  # Skip the build when nothing since the last built commit touched the Studio (this file
  # included), its shared packages or the workspace manifests — the mirror of the web
  # site's rule, `[ … ]` guard included.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- ./studio ./packages/sanity-dataset-resolve ./packages/site-languages ./pnpm-lock.yaml ./pnpm-workspace.yaml ./package.json'

# Dataset per deploy context, as the web site picks it: production deploys edit
# `production`, previews and branch deploys `development`. The hosted bundle can't see
# Netlify's `CONTEXT`, so the name is inlined at build, and the Studio skips its dataset
# probe at load. Values here override the Netlify UI: another dataset name means editing
# these lines.
[context.production.environment]
  SANITY_STUDIO_DATASET = "production"

[context.deploy-preview.environment]
  SANITY_STUDIO_DATASET = "development"

[context.branch-deploy.environment]
  SANITY_STUDIO_DATASET = "development"

# The Studio is a single-page app: every route (`/structure/…`, `/presentation/…`)
# is served by `index.html`. Not forced, so files in `dist/` still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # An editing tool, not content — keep it out of search indexes.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Against clickjacking: only the Studio itself and the Sanity Dashboard may frame it. The
    # Dashboard (`*.sanity.io`) opens registered Studios in a frame, so `X-Frame-Options`
    # (`DENY` / `SAMEORIGIN`) would lock it out. Presentation is unaffected: it frames the web
    # app, which has its own `frame-ancestors` in `web/next.config.ts`.
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.io"

# Vite names every script, stylesheet and font in `dist/static` by content hash, so a changed
# file gets a new URL and these can be cached for good. Favicons and the web manifest in the
# same folder keep fixed names, which is why the rules list extensions instead of `/static/*`.
[[headers]]
  for = "/static/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
