version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Monthly cadence — fires on the first matching day of the month.
      # Security advisories are NOT schedule-gated; they still arrive immediately.
      interval: monthly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      # Catch-all bundle: every minor + patch bump across the workspace
      # (web, studio, packages/*) lands in one PR per run.
      # Majors fall outside this filter and open as individual PRs for
      # manual review (e.g. Next 16→17, React 19→20).
      all-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node must track the runtime (Node 22 LTS), not the latest major.
      # Allow minor/patch within v22; block major bumps (e.g. 25.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
