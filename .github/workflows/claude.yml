name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Two guards for this PUBLIC repo:
    #  1. Org-internal only — skip in template forks (they lack the secret anyway).
    #  2. Only trusted authors (write access) may trigger; don't even start a runner
    #     for outside commenters. claude-code-action also re-checks write access.
    if: >-
      github.repository == 'backendforth/next-sanity-starter' &&
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # required: the action fetches its GitHub App token via OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticated via a Claude Max subscription token (NOT an API key).
          # Generated once with `claude setup-token`, stored as the
          # CLAUDE_CODE_OAUTH_TOKEN repo/org secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # Ping #github-logs when the run finishes (best-effort; reuses the org
      # Slack secrets). Skips cleanly if the Slack secrets aren't present.
      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          STATUS: ${{ job.status }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skipping notify"; exit 0
          fi
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/$PR"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            TEXT="🤖 Claude finished on \`${{ github.repository }}\`#${PR} — ${PR_URL}"
          else
            TEXT="⚠️ Claude run ${STATUS} on \`${{ github.repository }}\`#${PR} — ${RUN_URL}"
          fi
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg c "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$c,text:$t}')" \
            | jq -e '.ok' >/dev/null || echo "slack chat.postMessage failed"
