# Netlify — Next.js app in `web/` (pnpm monorepo).
#
# The Studio is a second Netlify site from the same repository, configured by
# `studio/netlify.toml` (package directory `studio`). This file is the web site's only.
#
# Build runs from the repository root so pnpm can resolve workspace packages.
# In the Netlify UI, keep the base directory at the repo root unless you mirror this layout elsewhere.
#
# Set in Site settings → Environment variables (Build + Runtime as needed):
#   SANITY_STUDIO_PROJECT_ID       — required for Next ↔ Sanity
#   SANITY_STUDIO_DATASET          — optional if you pin a dataset
#   NEXT_PUBLIC_SANITY_STUDIO_URL  — the Studio's hosting URL (CSP `frame-ancestors`, edit links)
#   NEXT_PUBLIC_SANITY_*           — optional client fallbacks
# Full list: `web/.env.example`
#
# Publish directory (why not `dist/`?):
# - Next.js writes its build output to `.next/` (not `dist/` like Vite or a static export `out/`).
# - `@netlify/plugin-nextjs` / OpenNext reads that output and packages SSR, functions, and assets
#   for Netlify; the live site is not a single flat `dist` folder.
# - `publish = "web/.next"` is the path to that Next output relative to the repo root (monorepo).

[build]
  # Netlify installs the workspace itself (pnpm, version from `packageManager`) before this runs.
  command = "pnpm --filter web run build"
  publish = "web/.next"
  # Skip the build when nothing since the last commit Netlify built for this context
  # (`CACHED_COMMIT_REF`) touched the web app, its shared package, the workspace manifests
  # or this file — not just the last commit, so a multi-commit push can't hide a change.
  # A build without cache has both refs equal; the `[ … ]` guard then builds instead of
  # skipping. Saves Netlify minutes on Studio-only pushes.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- ./web ./packages/sanity-dataset-resolve ./pnpm-lock.yaml ./pnpm-workspace.yaml ./package.json ./netlify.toml'

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Raise if the Next.js build runs out of memory on Netlify.
  NODE_OPTIONS = "--max-old-space-size=8192"

# Canonical origin for `metadataBase`, canonical/hreflang links, `og:url`,
# `sitemap.xml` and the sitemap reference in `robots.txt` — resolved in
# `web/src/utils/siteUrl.ts`.
#
# Left unset, the resolver falls back to Netlify's own `URL` on a production
# build, which is the site's primary domain and usually right. Set it once the
# site has its real domain, so the canonical never depends on which domain
# Netlify considers primary.
#
# Production context only, on purpose: `NEXT_PUBLIC_*` is inlined at BUILD time,
# so a deploy preview built with this value would claim to be canonical for the
# live domain. Previews instead fall through to `DEPLOY_PRIME_URL` and are
# canonical to themselves; a deploy that resolves neither fails the build rather
# than shipping a placeholder.
#
# [context.production.environment]
#   NEXT_PUBLIC_SITE_URL = "https://your-domain.tld"

# ── Security headers ─────────────────────────────────────────────────────────
#
# CSP, HSTS, Referrer-Policy and Permissions-Policy are emitted by Next itself,
# from `headers()` in `web/next.config.ts`. `[[headers]]` rules here only reach
# files Netlify serves straight from its CDN, never the SSR/ISR HTML from the
# Next.js function, so a policy declared here never governed the document.
# Self-hosted analytics hosts go into the `CSP_ANALYTICS_ORIGINS` build env var.

# ── CDN Edge Cache ────────────────────────────────────────────────────────────
#
# Two-header pattern for Netlify's edge network:
#   Cache-Control          → browser: never cache HTML (always fresh from CDN)
#   Netlify-CDN-Cache-Control → Netlify edge: cache 1 year, SWR 1 day
#
# @netlify/plugin-nextjs coordinates this with Next.js ISR automatically:
# when revalidateTag() fires in a webhook, Netlify purges the matching
# Netlify-Cache-Tag entries at the edge — so editors see changes immediately.
#
# Result: first request hits the Serverless Function, every subsequent request
# is served from the nearest edge node in <20 ms.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

# Hashed static assets — content-addressed, safe to cache forever at both layers
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=600"

# App Router Route Handlers — never cache, override the /* rule above
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

# Minimal redirects
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
