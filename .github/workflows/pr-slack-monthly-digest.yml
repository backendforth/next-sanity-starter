name: PR monthly Slack digest

on:
  schedule:
    - cron: "0 11 2 * *" # 2nd of month, 11:00 UTC (~12:00 Europe/Berlin) — day after Dependabot opens its bundles on the 1st
  workflow_dispatch:

jobs:
  digest:
    # Org-internal: skip in template forks so they never ping backendforth's Slack.
    if: ${{ github.repository == 'backendforth/next-sanity-starter' }}
    uses: backendforth/.github/.github/workflows/pr-slack-monthly-digest.yml@d14c26b47da93ba6943bee16471f2bdced345fb8 # main
    secrets: inherit
