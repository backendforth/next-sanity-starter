name: PR monthly Slack digest

on:
  schedule:
    - cron: "0 11 1 * *" # 11:00 UTC (~12:00 Europe/Berlin), 1st of each month
  workflow_dispatch:

jobs:
  digest:
    # Org-internal: skip in template forks so they never ping backendforth's Slack.
    if: ${{ github.repository == 'backendforth/next-sanity-starter' }}
    uses: backendforth/.github/.github/workflows/pr-slack-monthly-digest.yml@main
    secrets: inherit
