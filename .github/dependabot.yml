version: 2

# Two parallel pipelines because `main` and `variant/document-level` are
# treated as independently-shipped lines of the starter, not as
# trunk + downstream. Dependabot reads this file from the default branch
# only (`main`); the `target-branch` field is what fans updates out.
#
# Each branch gets one npm and one github-actions entry:
#   - monthly schedule — Dependabot's `monthly` interval always runs on the
#     1st of the month (`day` is only honored for `weekly`). The PR→Slack
#     monthly digest runs on the 2nd on purpose, so the channel never gets
#     bundles + digest on the same day.
#   - npm: two catch-all groups per run instead of one PR per dependency:
#     `all-non-major` bundles every minor + patch into one auto-mergeable
#     PR (see dependabot-auto-merge.yml); `all-major` bundles every major
#     into one PR that waits for manual review (e.g. Next 16→17).
#     `@types/node` major bumps ignored (pinned to Node 22 LTS).
#   - github-actions: every action and reusable workflow in one PR. The
#     workflows pin them to commit SHAs; Dependabot moves the SHA and its
#     `# vX.Y.Z` comment. Auto-merge treats the bundle like an npm one: a
#     major inside it waits for review.
#
# Keep the main and variant entries in lockstep — when editing one, mirror
# the change to the other.
#
# Security advisories are NOT schedule-gated and arrive immediately on
# both branches regardless of the monthly cadence.

updates:
  # ── main ───────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      all-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      all-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler rewrite) breaks `next build` on
      # Next 16: `tsc --noEmit` passes, but Next's own TypeScript detection
      # fails ("do not have the required package(s) installed") because the
      # package layout changed. Next's transitive @module-federation/dts-plugin
      # also still pins `typescript@^4.9 || ^5`. Drop this entry once Next
      # supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Berlin"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  # ── variant/document-level ─────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    target-branch: "variant/document-level"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      all-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      all-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler rewrite) breaks `next build` on
      # Next 16: `tsc --noEmit` passes, but Next's own TypeScript detection
      # fails ("do not have the required package(s) installed") because the
      # package layout changed. Next's transitive @module-federation/dts-plugin
      # also still pins `typescript@^4.9 || ^5`. Drop this entry once Next
      # supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "variant/document-level"
    schedule:
      interval: monthly
      time: "13:00"
      timezone: "Europe/Berlin"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
