name: PR Slack notify

on:
  pull_request:
    types: [opened, ready_for_review, closed]
    branches:
      - main
      - variant/document-level

jobs:
  notify:
    # Org-internal: skip in template forks so they never ping backendforth's Slack.
    if: ${{ github.repository == 'backendforth/next-sanity-starter' }}
    uses: backendforth/.github/.github/workflows/pr-slack-summary.yml@main
    secrets: inherit
