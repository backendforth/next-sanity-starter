name: CI

on:
  pull_request:
  push:
    branches: [main, variant/document-level]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The four job names are the required checks of the "Merge Protection" ruleset
# on main and variant/document-level. Renaming a job blocks every merge until
# the ruleset is updated.
jobs:
  verify:
    name: format • typecheck (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Formatting, lint and import order in one read-only pass (same as the
      # pre-push hook); findings are annotated on the PR. `pnpm format` fixes
      # them locally.
      - run: pnpm exec biome ci --reporter=github .
      - run: pnpm run typecheck
      # Wiring drift between a module's schema, component, query and the lists
      # that register them is a silent bug class — `pnpm gen:module` wires them
      # atomically, but hand-edits routinely miss one. This gate catches partial
      # wirings before they reach main.
      - run: pnpm run check:wiring
      # Unit tests for the wiring manifest plus an end-to-end `gen:module` run
      # (two modules, one inline) through typegen, check:wiring and tsc.
      - run: pnpm run test:tooling

  schema-typegen:
    name: schema typegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Studio schema extract, web query typegen, then `check:typegen`
      # (every `defineQuery` got a type). `sanity schema extract` loads
      # sanity.config.ts, which throws without a project id; nothing here calls
      # the Sanity API, so a placeholder is enough — same as the build jobs.
      - run: pnpm run generate
        env:
          SANITY_STUDIO_PROJECT_ID: ci-placeholder
      - name: Ensure schema typegen produced no changes
        run: git diff --exit-code

  build-web:
    name: build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run build
        env:
          # Builds without a project must still succeed (starter). Real
          # deploys provide SANITY_STUDIO_PROJECT_ID via the host's env.
          NEXT_TELEMETRY_DISABLED: "1"
      # First-load JS per route (gzip) into the job summary; fails when a route
      # exceeds its ceiling in .github/bundle-budget.json.
      - name: Bundle report
        run: node .github/scripts/bundle-report.mjs

  build-studio:
    name: build (studio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter studio run build
